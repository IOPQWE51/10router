name: Build 10Router fpk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构 (arm / x86)'
        required: false
        default: 'x86'
        type: choice
        options:
          - x86
          - arm

permissions:
  contents: write

jobs:
  build-fpk:
    runs-on: ${{ inputs.arch == 'arm' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build standalone server
        run: npm run build

      # ── Assemble fnos-packaging/app/server ─────────────────────────────
      - name: Copy standalone to fnos-packaging
        run: |
          set -euo pipefail
          rm -rf fnos-packaging/app/server
          mkdir -p fnos-packaging/app/server

          # standalone output (already includes custom-server.js via postbuild)
          cp -r .next/standalone/. fnos-packaging/app/server/

          # Next tracing may miss these — copy explicitly (mirrors Dockerfile)
          cp -r open-sse fnos-packaging/app/server/
          cp -r src/mitm fnos-packaging/app/server/

          mkdir -p fnos-packaging/app/server/node_modules
          cp -r node_modules/node-forge fnos-packaging/app/server/node_modules/
          cp -r node_modules/sql.js fnos-packaging/app/server/node_modules/
          cp -r node_modules/next fnos-packaging/app/server/node_modules/

          ls -la fnos-packaging/app/server/

      # ── Download fnpack ────────────────────────────────────────────────
      - name: Download fnpack
        env:
          FNPACK_VERSION: "1.2.1"
        run: |
          if [ "${{ inputs.arch }}" = "arm" ]; then
            FNPACK_BIN="fnpack-${FNPACK_VERSION}-linux-arm64"
          else
            FNPACK_BIN="fnpack-${FNPACK_VERSION}-linux-amd64"
          fi
          curl -fsSL -o /usr/local/bin/fnpack "https://static2.fnnas.com/fnpack/${FNPACK_BIN}"
          chmod +x /usr/local/bin/fnpack
          fnpack --help | head -3

      # ── Prepare manifest ───────────────────────────────────────────────
      - name: Set manifest platform
        run: |
          cd fnos-packaging
          if grep -qE '^platform[[:space:]]*=' manifest; then
            sed -i "s/^platform[[:space:]]*=.*/platform               = ${{ inputs.arch }}/" manifest
          else
            echo "platform               = ${{ inputs.arch }}" >> manifest
          fi
          grep -E '^(platform|appname|version|ctl_stop|install_dep_apps)[[:space:]]*=' manifest

      # ── Remove symlinks (fnpack 不支持) ────────────────────────────────
      - name: Remove symlinks
        run: |
          find fnos-packaging -type l -not -path '*/.git/*' -delete 2>/dev/null || true
          echo "symlinks remaining: $(find fnos-packaging -type l -not -path '*/.git/*' | wc -l)"

      # ── Build fpk ──────────────────────────────────────────────────────
      - name: Build fpk
        run: |
          set -euo pipefail
          cd fnos-packaging
          rm -f *.fpk
          fnpack build -d .
          [ -f 10router.fpk ] || { echo "ERROR: fnpack build failed"; exit 1; }
          VERSION="$(grep -E '^version[[:space:]]*=' manifest | head -1 | sed 's/.*=//;s/[[:space:]]//g')"
          mv 10router.fpk "10router-${VERSION}-${{ inputs.arch }}.fpk"
          ls -lh "10router-${VERSION}-${{ inputs.arch }}.fpk"
          echo "FPK_PATH=$PWD/10router-${VERSION}-${{ inputs.arch }}.fpk" >> "$GITHUB_ENV"

      # ── Upload artifact (manual dispatch) ──────────────────────────────
      - name: Upload fpk artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: 10router-fpk-${{ inputs.arch }}-${{ github.sha }}
          path: fnos-packaging/10router-*.fpk
          if-no-files-found: error
          retention-days: 14

      # ── Release asset (tag push) ───────────────────────────────────────
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fnos-packaging/10router-*.fpk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## ✅ 10Router fpk 构建完成 (${{ inputs.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- 文件: \`$FPK_PATH\`" >> "$GITHUB_STEP_SUMMARY"
